name: M1 Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: m1-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mizan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Mizan: Host=localhost;Database=mizan;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mizan.sln
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.20
      - name: Build
        run: dotnet build Mizan.sln --configuration Release --no-restore
      - name: Apply committed EF Core migrations
        run: dotnet ef database update --project src/Mizan.Infrastructure --startup-project src/Mizan.Api --configuration Release --no-build
      - name: Test — Domain
        run: dotnet test tests/Mizan.Domain.Tests/Mizan.Domain.Tests.csproj --configuration Release --no-restore --no-build
      - name: Test — Application
        run: dotnet test tests/Mizan.Application.Tests/Mizan.Application.Tests.csproj --configuration Release --no-restore --no-build
      - name: Test — API — Income
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_accept_income"
      - name: Test — API — Retry
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_return_same_operation_for_idempotent_retry"
      - name: Test — API — Conflict
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_reject_different_command_under_same_idempotency_key"
      - name: Test — API — Concurrent Duplicate
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_protect_concurrent_duplicate_income"
      - name: Test — API — Balance
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_derive_balance_after_income_and_concurrent_retry"
      - name: Test — API — Reversal
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_reverse_an_accepted_operation_without_mutating_the_original|FullyQualifiedName~Api_should_allow_only_one_concurrent_reversal_with_different_idempotency_keys"
      - name: Test — API — Account Lifecycle
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_close_and_reopen_account|FullyQualifiedName~Api_should_reject_normal_operations_on_closed_account_but_keep_balance_readable|FullyQualifiedName~Api_should_allow_reversal_after_account_is_closed|FullyQualifiedName~Api_should_serialize_account_close_against_concurrent_financial_operation"

      - name: Test — API — Recoverables
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_create_and_settle_recoverable_partially|FullyQualifiedName~Api_should_prevent_concurrent_over_settlement|FullyQualifiedName~Api_should_reject_recoverable_over_settlement|FullyQualifiedName~Api_should_allow_reversal_of_recoverable_expense"

      - name: Test — API — Shared Expenses
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_create_shared_expense_with_total_account_decrease_and_partial_recoverable|FullyQualifiedName~Api_should_return_same_shared_expense_for_idempotent_retry|FullyQualifiedName~Api_should_reject_invalid_shared_expense_recoverable_portion|FullyQualifiedName~Api_should_reject_shared_expense_reversal_while_recoverable_is_settled|FullyQualifiedName~Api_should_reverse_settlement_before_reversing_shared_expense"

      - name: Test — API — Obligations
        run: dotnet test tests/Mizan.Api.Tests/Mizan.Api.Tests.csproj --configuration Release --no-restore --no-build --filter "FullyQualifiedName~Api_should_create_obligation_without_changing_account_balance|FullyQualifiedName~Api_should_settle_and_cancel_obligations_without_creating_financial_effects|FullyQualifiedName~Api_should_reject_duplicate_obligation_lifecycle_transition|FullyQualifiedName~Api_should_allow_only_one_concurrent_obligation_settlement"
