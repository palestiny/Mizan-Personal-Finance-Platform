name: M1 Tests

on:
  push:
    branches:
      - foundation/m0-product-domain-foundation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mizan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Mizan: Host=localhost;Database=mizan;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mizan.sln
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.20
      - name: Apply committed EF Core migrations
        run: dotnet ef database update --project src/Mizan.Infrastructure --startup-project src/Mizan.Api
      - name: Test
        run: dotnet test Mizan.sln --configuration Release --no-restore
